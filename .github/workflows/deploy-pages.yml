name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/edge-sensors
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare dashboard files for GitHub Pages
        run: |
          touch ./dashboard/.nojekyll
          sed -i 's|href="/styles.css"|href="styles.css"|g' ./dashboard/*.html
          sed -i 's|src="/app.js"|src="app.js"|g' ./dashboard/*.html
          sed -i 's|href="/report"|href="report.html"|g' ./dashboard/*.html
          sed -i 's|href="/admin"|href="index.html"|g' ./dashboard/*.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dashboard'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
