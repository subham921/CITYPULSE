services:
  # Python FastAPI Backend (API Server)
  - type: web
    name: citypulse-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MAPPLS_API_KEY
        sync: false
      - key: MAPPLS_CLIENT_ID
        sync: false
      - key: MAPPLS_CLIENT_SECRET
        sync: false

  # Node.js Express Frontend (SSR + Tailwind CSS)
  - type: web
    name: citypulse-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run server:start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: API_BACKEND_URL
        fromService:
          name: citypulse-backend
          type: web
          property: hostport
      - key: PORT
        value: 3000
      - key: MAPPLS_API_KEY
        sync: false
